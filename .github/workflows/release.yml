name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      count: ${{ steps.detect.outputs.count }}
      version-pr-open: ${{ steps.vpr.outputs.version-pr-open }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - id: detect
        run: |
          count=$(find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' | wc -l | tr -d ' ')
          echo "count=$count" >> "$GITHUB_OUTPUT"
      - id: vpr
        # A queued run can start after the previous run already opened the
        # Version Packages PR but before it was merged; without this check it
        # would open a duplicate (see #87).
        run: |
          open=$(gh pr list --head changeset-release/main --state open --json id --jq 'length')
          echo "version-pr-open=$open" >> "$GITHUB_OUTPUT"

  version-pr:
    needs: detect
    if: needs.detect.outputs.count != '0' && needs.detect.outputs.version-pr-open == '0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Open or update the Version Packages PR
        uses: changesets/action@v1
        with:
          version: bun run cs:version
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  tag:
    needs: detect
    if: >-
      needs.detect.outputs.count == '0' &&
      contains(github.event.head_commit.message, 'chore: version packages')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Tag released version
        run: |
          VERSION=$(bun -p "require('./package.json').version")
          echo "tagging v$VERSION"
          git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null || git tag "v$VERSION"
          git push origin "v$VERSION"
      - name: Draft the GitHub release
        # Tag pushes made with GITHUB_TOKEN do not trigger other workflows,
        # so the draft release is created here instead of by draft-release.yml
        # (which still covers manually pushed tags).
        run: |
          VERSION=$(bun -p "require('./package.json').version")
          gh release create "v$VERSION" --draft --generate-notes --title "ferry v$VERSION"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
