name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Format check
        run: bun run format:check
      - name: Build
        run: bun run build
      - name: Validate exports (publint)
        run: bunx publint
      - name: Validate types (arethetypeswrong)
        # FalseESM: known-safe dual-format tradeoff (ESM-syntax declarations on
        # the CJS bundle); all exports are plain functions/classes.
        # node16 profile: exports subpaths cannot resolve under legacy node10,
        # which we do not target (engines.node >= 18).
        run: bunx @arethetypeswrong/cli --pack --profile node16 --ignore-rules false-esm
      - name: Bundle size budget
        run: bun scripts/check-size.ts
      - name: Package contents audit
        run: bun scripts/check-package.ts
      - name: Test with coverage
        run: bun test --coverage
      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
